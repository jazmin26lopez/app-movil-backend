
# Microservicio
spring.application.name=ms-flushing
server.port=8082

# Conexion Oracle
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=BEBEDERO_FLUSHING
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false




# Swagger UI - Ambos microservicios
springdoc.swagger-ui.urls[0].name=Flushing
springdoc.swagger-ui.urls[0].url=/v3/api-docs

springdoc.swagger-ui.urls[1].name=Infraestructura
springdoc.swagger-ui.urls[1].url=http://localhost:8081/v3/api-docs

springdoc.swagger-ui.urlsPrimaryName=Flushing
